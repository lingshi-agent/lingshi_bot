services:
  lingshi-gateway:
    image: ${LINGSHI_IMAGE:-lingshi:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      LINGSHI_GATEWAY_TOKEN: ${LINGSHI_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${LINGSHI_CONFIG_DIR}:/home/node/.lingshi
      - ${LINGSHI_WORKSPACE_DIR}:/home/node/.lingshi/workspace
    ports:
      - "${LINGSHI_GATEWAY_PORT:-18789}:18789"
      - "${LINGSHI_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${LINGSHI_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  lingshi-cli:
    image: ${LINGSHI_IMAGE:-lingshi:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      LINGSHI_GATEWAY_TOKEN: ${LINGSHI_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${LINGSHI_CONFIG_DIR}:/home/node/.lingshi
      - ${LINGSHI_WORKSPACE_DIR}:/home/node/.lingshi/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
