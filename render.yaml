services:
  - type: web
    name: lingshi
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: LINGSHI_STATE_DIR
        value: /data/.lingshi
      - key: LINGSHI_WORKSPACE_DIR
        value: /data/workspace
      - key: LINGSHI_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: lingshi-data
      mountPath: /data
      sizeGB: 1
